plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.188'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    create("client") {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        modSource project.sourceSets.main
    }
    create("server") {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        arguments.addAll('--nogui')
        modSource project.sourceSets.main
    }
    create("gameTestServer") {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        modSource project.sourceSets.main
    }
    create("data") {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        arguments.addAll('--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath())
        modSource project.sourceSets.main
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name = 'LDLib Maven'
        url = "https://maven.firstdark.dev/snapshots/"
    }
    maven {
        name = 'Configuration'
        url = 'https://repo.repsy.io/mvn/toma/public/'
    }
    maven {
        name = 'Configuration (backup)'
        url = 'https://api.repsy.io/mvn/toma/public/'
    }
    maven {
        name = 'Mekanism Maven'
        url = 'https://modmaven.dev/'
    }
    maven {
        name = "Saps Releases"
        url = "https://maven.saps.dev/releases"
    }
    maven {
        name = "Tterrag"
        url = "https://maven.gegy.dev/releases/"
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    implementation "com.gregtechceu.gtceu:gtceu-${mc_version}:${gtm_version}"
    implementation "com.lowdragmc.ldlib2:ldlib2-neoforge-${mc_version}:${ldlib2_version}:all"
    implementation "com.tterrag.registrate:Registrate:MC${mc_version}-${registrate_version}"

    compileOnly "mekanism:Mekanism:${mekanism_version}:api"
    runtimeOnly "mekanism:Mekanism:${mekanism_version}"
    runtimeOnly "mekanism:Mekanism:${mekanism_version}:additions"
    runtimeOnly "mekanism:Mekanism:${mekanism_version}:generators"
    runtimeOnly "mekanism:Mekanism:${mekanism_version}:tools"
}

configurations.configureEach {
    resolutionStrategy {
        force "dev.toma.configuration:configuration-${mc_version}:${configuration_version}-neoforge"
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version   : mc_version,
            neo_version         : neo_version,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_license         : mod_license,
            mod_version         : mod_version,
            mod_authors         : mod_authors,
            mod_description     : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}